<!DOCTYPE html>
<html>
<head>
    <title>Список постов</title>
</head>
<body>
    <h1>Список постов</h1>
    <ul>
        {% for post in object_list %}
            <li>
                <a href="{{ post.get_absolute_url }}">{{ post.title }}</a>
                ({{ post.created_at|date:"d M Y" }})
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'post-create' %}">Создать новую статью</a>
</body>
</html>
